<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#1A0F0A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#C9A961" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#C9A961" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#B8860B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FAF3E7"/>
      <stop offset="60%" stop-color="#E2CDB0"/>
      <stop offset="100%" stop-color="#A87E4F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%"  stop-color="#E0C078"/>
      <stop offset="100%" stop-color="#9A7209"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- left text -->
  <g transform="translate(80, 200)">
    <!-- eyebrow -->
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="20" font-weight="600" letter-spacing="6" fill="#C9A961">
      ✦ PREMIUM ARTISAN COFFEE ✦
    </text>

    <!-- headline line 1 -->
    <text x="0" y="100" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#FFFBF5">
      Where Every Sip
    </text>

    <!-- headline line 2 (script italic gold) -->
    <text x="0" y="220" font-family="'Brush Script MT', cursive" font-size="120" font-style="italic" fill="#C9A961">
      Tells a Story
    </text>

    <!-- description -->
    <text x="0" y="290" font-family="'Inter', sans-serif" font-size="22" fill="#FAF3E7" opacity="0.85">
      Hand-roasted beans · Masterful baristas · Brooklyn, NY
    </text>
  </g>

  <!-- right: large coffee cup -->
  <g transform="translate(900, 180) scale(1.6)">
    <!-- steam -->
    <g stroke="#FAF3E7" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M70 30 c 0 12, 12 12, 12 24 s -12 12, -12 24"/>
      <path d="M95 25 c 0 12, 12 12, 12 24 s -12 12, -12 24"/>
      <path d="M120 30 c 0 12, 12 12, 12 24 s -12 12, -12 24"/>
    </g>

    <!-- saucer -->
    <ellipse cx="100" cy="200" rx="80" ry="11" fill="url(#cup)" stroke="url(#gold)" stroke-width="2"/>

    <!-- handle -->
    <path d="M150 110 q 38 -2 38 32 q 0 32 -38 30" fill="none" stroke="url(#cup)" stroke-width="12" stroke-linecap="round"/>
    <path d="M150 110 q 38 -2 38 32 q 0 32 -38 30" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- cup body -->
    <path d="M40 90 L160 90 L150 188 Q 100 205 50 188 Z" fill="url(#cup)" stroke="url(#gold)" stroke-width="2"/>

    <!-- coffee top -->
    <ellipse cx="100" cy="90" rx="60" ry="9" fill="#3E2723"/>
    <ellipse cx="100" cy="90" rx="60" ry="9" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <ellipse cx="85"  cy="86" rx="18" ry="2" fill="#C9A77A" opacity="0.5"/>
  </g>

  <!-- footer brand -->
  <g transform="translate(80, 540)">
    <text font-family="Georgia, serif" font-size="36" font-weight="700" fill="#FFFBF5">
      Brew <tspan fill="#C9A961" font-style="italic">&amp;</tspan> Soul
    </text>
    <text x="0" y="32" font-family="'Inter', sans-serif" font-size="14" letter-spacing="4" fill="#FAF3E7" opacity="0.7">
      BREWANDSOUL.COM
    </text>
  </g>
</svg>
